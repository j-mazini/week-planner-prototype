<!doctype html>
<meta charset="utf-8">
<title>Ultra-wide harness</title>
<style>
  body { margin: 0; background: #111; color: #eee; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  #out { padding: 12px; white-space: pre; line-height: 1.6; }
  .rig { overflow: hidden; border-top: 1px solid #333; }
  .rig > iframe { display: block; border: 0; transform-origin: 0 0; }
</style>
<div id="out">a medir…</div>
<div id="rigs"></div>
<script>
const WIDTHS = [1920, 2560, 3440, 3840, 5120];
const HEIGHT = 1440;
const SCALE = 0.16;

// O primeiro selector que existir na page é o container de conteúdo.
const CONTAINER = [
  '.dgp-page-frame-container',
  '.home-new',
  '.my-performance',
  'main[class*="max-w-content"]',
].join(', ');

// Grids nomeados. Ausentes numa dada rota: simplesmente não aparecem no resultado.
const GRIDS = {
  homeKpis:     '.home-new__kpis',
  homePageGrid: '.home-new__page-grid',
  homeWorkspace:'.home-new__workspace',
};

const route = new URLSearchParams(location.search).get('route') || '/vendor';
const out = document.getElementById('out');
const rigs = document.getElementById('rigs');

// querySelector devolve o primeiro match por ordem no documento, esteja ou
// nao desenhado. Uma variante mobile escondida (`display:none`) conta como
// match mas nao tem layout: getClientRects() esta vazio nesse caso, e e
// exatamente quando o browser deixa de resolver propriedades computadas
// (ver countCols). Por isso escolhemos o primeiro match com layout real.
function firstLaidOut(doc, selector) {
  const all = Array.from(doc.querySelectorAll(selector));
  if (all.length === 0) return { el: null, matched: 0 };
  const rendered = all.find((el) => el.getClientRects().length > 0);
  return { el: rendered || null, matched: all.length };
}

// gridTemplateColumns computado so e uma lista de tracks resolvida
// ("300px 300px 300px") quando o elemento tem layout. Em elementos sem
// layout (largura 0) o browser pode devolver a forma especificada
// ("repeat(5, minmax(0px, 1fr))"), cujo split(' ').length conta fragmentos
// de sintaxe, nao colunas — 3 em vez de 5. Nunca inventamos um inteiro a
// partir dessa forma: contamos so quando e uma lista de comprimentos, e
// caso contrario devolvemos o valor em bruto com uma nota.
function countCols(computed) {
  const trimmed = computed.trim();
  const isResolvedTrackList = /^-?[\d.]+px(\s+-?[\d.]+px)*$/.test(trimmed);
  if (isResolvedTrackList) {
    return trimmed.split(/\s+/).filter(Boolean).length;
  }
  return { raw: trimmed, note: 'valor nao resolvido (sem layout?) — nao contado' };
}

function measure(win, width) {
  const doc = win.document;
  const { el, matched } = firstLaidOut(doc, CONTAINER);
  if (!el) {
    return matched > 0
      ? { width, error: matched + ' match(es) do container, nenhum com layout (escondido/mobile)' }
      : { width, error: 'container nao encontrado' };
  }
  const r = el.getBoundingClientRect();
  const cols = {};
  for (const [name, sel] of Object.entries(GRIDS)) {
    const { el: g, matched: gMatched } = firstLaidOut(doc, sel);
    if (g) {
      cols[name] = countCols(win.getComputedStyle(g).gridTemplateColumns);
    } else if (gMatched > 0) {
      cols[name] = { note: gMatched + ' match(es), nenhum com layout (escondido/mobile)' };
    }
  }
  return {
    width,
    selector: (el.className || '').toString().split(/\s+/)[0] || el.tagName.toLowerCase(),
    contentWidth: Math.round(r.width),
    // >0 significa deslocado para a direita do centro do ecra.
    centreOffset: Math.round((r.left + r.width / 2) - width / 2),
    cols,
  };
}

function load(width) {
  return new Promise((resolve) => {
    const rig = document.createElement('div');
    rig.className = 'rig';
    rig.style.height = Math.round(HEIGHT * SCALE) + 'px';
    const f = document.createElement('iframe');
    f.width = String(width);
    f.height = String(HEIGHT);
    f.style.transform = 'scale(' + SCALE + ')';
    f.src = route;
    f.addEventListener('load', () => {
      // Deixa o layout do cliente assentar antes de medir.
      setTimeout(() => {
        let result;
        try { result = measure(f.contentWindow, width); }
        catch (e) { result = { width, error: String(e && e.message || e) }; }
        resolve(result);
      }, 1200);
    });
    rig.appendChild(f);
    rigs.appendChild(rig);
  });
}

(async () => {
  const rows = [];
  for (const w of WIDTHS) {
    const r = await load(w);
    rows.push(r);
    console.log('[UW] ' + JSON.stringify(r));
    out.textContent = 'rota: ' + route + '\n\n' + rows.map(x => JSON.stringify(x)).join('\n');
  }
  console.log('[UW] done ' + route);
})();
</script>
